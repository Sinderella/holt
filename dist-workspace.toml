[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# D-12: SHA-256 checksums are emitted alongside every release artifact by
# dist 0.31's default behavior — verified via `dist plan`, which reports a
# `.sha256` sidecar for each of the 4 platform tarballs plus a top-level
# `sha256.sum` aggregate. No explicit `checksum = "sha256"` toml setting is
# needed. GPG signing is intentionally not enabled at v0.1; we accept
# commit signing commit-time signing as release identity per CONTEXT.md
# D-12 and ROADMAP success criterion #1. Revisit if/when ≥3 issues request
# GPG-signed artifacts.
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# D-04: Homebrew tap GitHub repo. Homebrew's `homebrew-` prefix is stripped at
# install time, so the user-facing command is `brew install Sinderella/holt`
# (which is short for `brew install Sinderella/holt/holt` when the formula
# name matches the tap suffix). The empty repo at github.com/Sinderella/
# homebrew-holt is a one-time manual prerequisite — see plan 04-02's README
# install instructions for the `gh repo create` step.
tap = "Sinderella/homebrew-holt"
# D-04: formula name override — Cargo package is `holt-cli`, but the user-
# facing binary and project name is `holt`. Without this override the formula
# would be named `holt-cli` and `brew install Sinderella/holt` (D-04's
# documented short-form) would not resolve.
formula = "holt"
# D-04: enable the homebrew publisher so dist auto-pushes the formula on every
# release tag. Without this, `installers = ["homebrew"]` only generates the
# .rb file as a release artifact — it does not push to the tap repo.
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# D-03: exactly 4 targets at v0.1. Linux arm64 deferred to v0.1.x per
# docs/02-scope.md; Windows arm64 not on the table at v0.1. The Windows
# matrix entry is marked `continue-on-error: true` in release.yml so a
# Windows build failure does NOT block the Linux + macOS-x64 + macOS-arm64
# release-success gate (`Linux ∧ macOS-x64 ∧ macOS-arm64`).
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# D-03: `release.yml` carries a hand-edited
# `continue-on-error: ${{ contains(matrix.targets, 'x86_64-pc-windows-msvc') }}`
# expression on the `build-local-artifacts` job (Windows allow-failure half of
# D-03). dist's drift check would otherwise revert the edit on the next
# `dist generate`. The narrow `["ci"]` whitelist keeps everything else in the
# release workflow regenerable; only the CI scaffold is allowed to differ from
# the dist-emitted baseline. Future dist version bumps may obviate this — if
# cargo-dist gains a per-target allow-failure config setting, drop this and
# move the allow-failure declaration into the toml.
#
# Re-applying the hand-edit after a `dist generate` regeneration: temporarily
# comment out the `allow-dirty` line below, run `dist generate --mode ci`, then
# manually re-add the `continue-on-error: ${{ contains(matrix.targets,
# 'x86_64-pc-windows-msvc') }}` line right after `runs-on: ${{ matrix.runner }}`
# in the `build-local-artifacts` job, then re-enable `allow-dirty`.
allow-dirty = ["ci"]
