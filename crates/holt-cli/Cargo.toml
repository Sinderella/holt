[package]
name = "holt-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "holt"
path = "src/main.rs"

[dependencies]
holt-schemas = { path = "../holt-schemas" }
holt-supervisor = { path = "../holt-supervisor" }
holt-render = { path = "../holt-render" }
holt-orchestrator = { path = "../holt-orchestrator" }
holt-hooks = { path = "../holt-hooks" }
clap.workspace = true
anyhow.workspace = true
humantime.workspace = true
serde.workspace = true
serde_json.workspace = true
# WR-05: --self-bench needs an isolated cache root so it does not pollute the
# user's real ~/.cache/holt/ telemetry stream. tempfile is on the runtime path
# but only used by the bench harness; --self-bench is an opt-in CLI mode, not
# the render path.
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
