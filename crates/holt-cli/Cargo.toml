[package]
name = "holt-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# D-02 / plan-check I-1: holt-cli is the only published-binary crate, but at
# v0.1 we ship via dist artifacts (binstall + GitHub Release direct download —
# Homebrew tap deferred to v0.1.x), NOT crates.io. Publishing to crates.io
# would also force every internal library dep (holt-schemas, holt-supervisor,
# holt-hooks, holt-orchestrator, holt-render) to be cargo-publishable too —
# those are `#[non_exhaustive]` and not API-stable yet. Deferred to v0.5+ per
# 04-CONTEXT.md "Open questions deferred to v0.1.x or v0.5".
publish = false

# D-02 (post-tap-drop, 2026-04-29): `publish = false` above blocks crates.io
# publication; dist needs an explicit opt-in to still include this package's
# binary in the release artifact build.
[package.metadata.dist]
dist = true

[[bin]]
name = "holt"
path = "src/main.rs"

[dependencies]
holt-schemas = { path = "../holt-schemas" }
holt-supervisor = { path = "../holt-supervisor" }
holt-render = { path = "../holt-render" }
holt-orchestrator = { path = "../holt-orchestrator" }
holt-hooks = { path = "../holt-hooks" }
clap.workspace = true
anyhow.workspace = true
humantime.workspace = true
serde.workspace = true
serde_json.workspace = true
# Phase 2 D-14: ISO 8601 timestamp for `Env.now_iso` plumbed into
# `holt_hooks::handle_event` from the `holt hook <event>` dispatcher.
jiff.workspace = true
# Phase 3 D-09 + module-level error types in install_hooks/{mod,merge,lock}.rs.
thiserror.workspace = true
# Phase 3 D-02 + D-03 / C4: jsonc-parser CST round-trip preserves comments +
# key order on the settings.json read-merge-write path. C4 confines this dep
# to holt-cli only — verified by the workspace-root `cli_dep_boundary` test
# in plan 03-02.
jsonc-parser = { version = "0.26", features = ["cst"] }
# Phase 3 D-04 + D-05 / C3: fs2 exclusive lock on settings.json for the
# read-merge-write window. C4 confines this dep to holt-cli only — verified
# by the same workspace-root boundary test in plan 03-02.
fs2 = "0.4"
# WR-08: tempfile was previously a runtime dependency for the
# --self-bench / --self-bench-hook harnesses. It is now hand-rolled in
# crates/holt-cli/src/self_bench.rs::BenchScratchDir so the release binary
# does not pull cfg-if/fastrand/libc in for an opt-in CLI mode that no end
# user invokes. tempfile remains in dev-dependencies for the integration
# tests below.

[dev-dependencies]
tempfile.workspace = true
# Plan 03-02 D-15: SIGKILL atomicity test calls libc::kill(pid, SIGKILL) FFI
# directly. `libc` was preferred over `nix` because `nix` is already a runtime
# dep on `holt-supervisor`; pulling it as a `holt-cli` dev-dep would cross
# crate boundaries. `libc` is on the no-forbidden list and is already in the
# transitive dependency tree (via tempfile / fs2), so this is no extra weight.
libc = "0.2"
