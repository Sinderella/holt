[package]
name = "holt-hooks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Disable cargo's auto-test discovery so it doesn't duplicate the
# `sigkill_test_driver.rs` file (which is also declared as a `[[bin]]` test
# driver below — see Task 9 / D-13). Tests are explicitly declared via
# `[[test]]` blocks at the bottom of this manifest.
autotests = false

# D-02: holt-cli is the ONLY package that produces a release artifact at v0.1.
# Without this opt-out, `dist` (cargo-dist 0.31) would ship the
# `sigkill_test_driver` binary declared below as a release artifact for all 5
# platforms — that driver is a Phase 2 D-13 SIGKILL atomicity test fixture, NOT
# a user-facing tool, and shipping it would be both wrong and confusing.
[package.metadata.dist]
dist = false

[dependencies]
# Phase 1 keystone — Heartbeat type, atomic_write helper, read_heartbeat (used in tests).
holt-schemas = { path = "../holt-schemas" }
# breach routing for parse_fail / unwritable (D-04, D-06 tier-4); also paths::default_cache_root
# for tier-3 of the D-06 fallback chain.
holt-supervisor = { path = "../holt-supervisor" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# ISO 8601 timestamps for Heartbeat.started / .updated (per CLAUDE.md "Use jiff").
jiff = { workspace = true }
# Top-level error surface for handle_event internals; never bubbled to caller.
anyhow = { workspace = true }

# Unix-only: nix is currently used for getuid()-based path salting in path.rs
# (D-06 tier-2 builds $TMPDIR/holt-$UID/sessions/). We do NOT rely on nix for
# the 0600 chmod (that uses std::os::unix::fs::PermissionsExt). Pulled in for
# symmetry with holt-supervisor and to keep the door open for the SIGKILL test
# driver to call nix::sys::signal::kill if needed.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
holt-schemas = { path = "../holt-schemas" }

# Test driver used by tests/sigkill_atomicity.rs (D-13). The driver reads a
# fixture path from $HOLT_HOOKS_TEST_FIXTURE, fires handle_event(PreToolUse),
# then exits. Out-of-process execution is required because we SIGKILL the
# child mid-write and the parent must observe the half-state — same-process
# tests can't reproduce the partial-write window.
[[bin]]
name = "sigkill_test_driver"
path = "tests/sigkill_test_driver.rs"
test = false
bench = false
required-features = []

# Integration tests — declared explicitly because `autotests = false` above
# disables cargo's auto-discovery (necessary to avoid double-targeting the
# sigkill_test_driver.rs file as both a `[[bin]]` and an integration test).
[[test]]
name = "assemble_field_policy"
path = "tests/assemble_field_policy.rs"

[[test]]
name = "handle_event_smoke"
path = "tests/handle_event_smoke.rs"

[[test]]
name = "sigkill_atomicity"
path = "tests/sigkill_atomicity.rs"
