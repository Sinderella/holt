name: CI

# ----------------------------------------------------------------------------
# DEFERRED 2026-04-30: only macOS jobs run in CI for now.
#
# Non-macOS jobs are gated on `if: false`. Re-enable them as 1.0 approaches by
# flipping each job's `if:` line back to `if: true` (or removing the line).
# Defer marker: "v0.5+1.0-prep" — restore when the v0.5 milestone (`holt
# doctor`) closes and 1.0 prep begins.
#
# Reason: many of the non-macOS builds break on the freshly-bootstrapped GitHub
# repo (untested Windows surface, stable-toolchain drift, MSRV-Linux); fixing
# them isn't load-bearing for v0.5 development. macOS coverage is enough to
# catch most regressions during the next milestone.
#
# Currently enabled jobs:
#   - lint (macOS, fmt + clippy)
#   - test-macos (MSRV 1.87, full test + bench)
#   - msrv-macos (MSRV 1.87 build-only)
# ----------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy (MSRV 1.87, macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: test (MSRV 1.87, x86_64-unknown-linux-gnu) — REQUIRED
    if: false  # DEFERRED to v0.5+1.0-prep — see header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - name: install strace
        run: sudo apt-get update && sudo apt-get install -y strace procps
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      - run: cargo test --test architecture_dag
      - name: self-bench gate
        run: ./target/release/holt --self-bench --json --iterations 30 | tee /tmp/bench.json
      - name: assert self-bench PASS
        run: |
          python3 -c "import json,sys; d=json.load(open('/tmp/bench.json')); sys.exit(0 if d['passed'] else 1)"
      - name: Hook self-bench PASS gate (D-15)
        run: ./target/release/holt --self-bench-hook PreToolUse --json --iterations 30 | tee /tmp/bench-hook.json
      - name: assert hook self-bench PASS (D-15)
        run: |
          python3 -c "import json,sys; d=json.load(open('/tmp/bench-hook.json')); sys.exit(0 if d['passed'] else 1)"

  test-macos:
    name: test (MSRV 1.87, aarch64-apple-darwin) — REQUIRED
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      - run: cargo test --test architecture_dag
      - name: self-bench gate
        run: ./target/release/holt --self-bench --json --iterations 30 | tee /tmp/bench.json
      - name: assert self-bench PASS
        run: |
          python3 -c "import json,sys; d=json.load(open('/tmp/bench.json')); sys.exit(0 if d['passed'] else 1)"
      - name: Hook self-bench PASS gate (D-15)
        run: ./target/release/holt --self-bench-hook PreToolUse --json --iterations 30 | tee /tmp/bench-hook.json
      - name: assert hook self-bench PASS (D-15)
        run: |
          python3 -c "import json,sys; d=json.load(open('/tmp/bench-hook.json')); sys.exit(0 if d['passed'] else 1)"

  test-windows:
    name: test (Windows x86_64) — best-effort (allowed-failure)
    if: false  # DEFERRED to v0.5+1.0-prep — see header
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      - run: cargo test --test architecture_dag

  stable-linux:
    name: test (stable, Linux x86_64) — informational
    if: false  # DEFERRED to v0.5+1.0-prep — see header
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  stable-macos:
    name: test (stable, macOS arm64) — informational
    if: false  # DEFERRED to v0.5+1.0-prep — see header (informational job; macOS coverage on MSRV 1.87 is enough during v0.5)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # D-08: dedicated MSRV gate pinned to `1.87.0` toolchain. Build-only — tests
  # are NOT re-run here because the test-{linux,macos,windows} jobs above are
  # already pinned to 1.87.0 and would re-cover that surface. The MSRV gate's
  # purpose is to catch a contributor accidentally relying on a post-1.87
  # stdlib API or syntax — `cargo build --release` is sufficient to surface
  # those errors at compile time, and keeps CI minutes flat per CONTEXT.md
  # D-08 rationale.
  msrv-linux:
    name: MSRV build (1.87.0, x86_64-unknown-linux-gnu) — REQUIRED
    if: false  # DEFERRED to v0.5+1.0-prep — see header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  msrv-macos:
    name: MSRV build (1.87.0, aarch64-apple-darwin) — REQUIRED
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  msrv-windows:
    name: MSRV build (1.87.0, Windows x86_64) — best-effort (allowed-failure)
    if: false  # DEFERRED to v0.5+1.0-prep — see header
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
