[workspace]
# WR-11: resolver = "3" is implied by edition = "2024" and MSRV = 1.87
# (resolver 3 stabilized in 1.84). Dropping the explicit `resolver = "2"` line
# gives us MSRV-aware feature unification by default; we set MSRV in
# [workspace.package] above so this is safe.
members = [
    "crates/holt-schemas",
    "crates/holt-supervisor",
    "crates/holt-hooks",
    "crates/holt-orchestrator",
    "crates/holt-render",
    "crates/holt-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/Sinderella/holt"

# ------------------------------------------------------------------
# Workspace-root package (D-15).
#
# The root is BOTH a virtual workspace AND a tiny package whose only purpose
# is hosting workspace-level integration tests like `tests/architecture_dag.rs`
# that walk `cargo metadata` to enforce cross-crate invariants (C2). The
# package itself ships no library/binary code and is excluded from any release
# artifact via `publish = false`.
# ------------------------------------------------------------------
[package]
name = "holt-workspace-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Empty default-run set: there is no [[bin]] / [lib] target, only [[test]]s.
autobins = false
autoexamples = false
autobenches = false
autotests = true

[[test]]
name = "architecture_dag"
path = "tests/architecture_dag.rs"

# Plan 03-02 D-03 + D-05 / C4 enforcement. BFS-walks `cargo metadata` to
# assert that `jsonc-parser` and `fs2` packages have no incoming edge from
# any non-`holt-cli` workspace crate. Adding either dep to `holt-schemas`,
# `holt-supervisor`, `holt-hooks`, `holt-orchestrator`, or `holt-render`'s
# Cargo.toml MUST fail this test.
[[test]]
name = "cli_dep_boundary"
path = "tests/cli_dep_boundary.rs"

[dev-dependencies]
serde_json.workspace = true

[workspace.dependencies]
# Pinned exactly per CONTEXT.md / RESEARCH.md / CLAUDE.md.
process-wrap = { version = "=9.1.0", features = ["std", "process-group"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jiff = "0.2"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
thiserror = "1"
humantime = "2.3"
nix = { version = "0.27", features = ["signal"] }
# dev-only:
tempfile = "3"

[profile.release]
# D-04: required to hit sub-20ms cold-start budget on macOS arm64 / Linux x86_64.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
